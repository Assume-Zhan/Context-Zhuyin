name: phonetic-candidate

services:
  phonetic-candidate-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: phonetic-candidate:dev
    container_name: phonetic-candidate-dev
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - hf-cache:/cache/huggingface
      - claude-config:/home/dev/.claude
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: 8g
    stdin_open: true
    tty: true
    command: sleep infinity

volumes:
  hf-cache:
  claude-config:
